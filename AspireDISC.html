// ─── DATA ────────────────────────────────────────────────────────────────────

const DISC_META = {

const STYLE_DESCRIPTIONS = {
  D:{headline:"Results-Driven Achiever",traits:["Direct communicator","Decisive under pressure","Loves challenges","Competitive drive","Bottom-line focused"],strengths:"Gets things done fast. Takes initiative. Owns escalations. Drives results when the pressure is on.",watchFor:"Can come across as blunt or impatient. May skip process steps. Needs to be heard before they listen.",msp:"Natural at closing tickets, owning client escalations, and leading under fire. Put them on your hardest problems.",worksWith:"Give them autonomy and clear outcomes. Skip the backstory — lead with the ask. Let them win.",friction:"Clashes with High S (too slow) and High C (too much process). Will steamroll if unchecked."},
  I:{headline:"Energizing Connector",traits:["Enthusiastic & optimistic","Builds rapport fast","Verbal processor","Motivates others","Idea generator"],strengths:"Makes clients feel valued. Energizes teams. Sells with authenticity. Creates momentum around new ideas.",watchFor:"May overcommit, avoid conflict, or lose interest in routine work. Details can slip.",msp:"Your best client-facing asset. Thrives in QBRs, new client onboarding, and team culture moments.",worksWith:"Recognize them publicly. Give them an audience. Pair them with a High C to cover the details.",friction:"Frustrates High C (not enough rigor) and High D (too much talking). Can go quiet when criticized."},
  S:{headline:"Dependable Anchor",traits:["Patient & steady","Deep team loyalty","Process-oriented","Conflict-averse","Reliable executor"],strengths:"The glue that holds teams together. Delivers consistently, listens deeply, and builds trust over time.",watchFor:"Resists sudden change. Won't surface problems without prompting. Needs safety to speak up.",msp:"Backbone of recurring managed services. Strong in documentation, client retention, and steady support queues.",worksWith:"Give advance notice of changes. Ask for their opinion directly — they won't volunteer it. Acknowledge loyalty.",friction:"Overwhelmed by High D urgency. Can feel steamrolled. Needs structure or defaults to task updates only."},
  C:{headline:"Precision-Driven Analyst",traits:["Detail-oriented","Systematic thinker","Risk-aware","Quality-obsessed","Follows process"],strengths:"Gets it right the first time. Catches errors others miss. Asks the question no one else thought to ask.",watchFor:"Can over-analyze and delay decisions. Uncomfortable with ambiguity. May seem cold or overly critical.",msp:"Your best technical lead, compliance owner, or documentation writer. Thrives when standards are clear.",worksWith:"Give them data, time to think, and written agendas. Never spring surprises. Respect their process.",friction:"Conflicts with High I (too casual, too many feelings) and High D (too fast, not enough rigor)."},
};
const COMBO_TIPS = {
  "D+I":"High energy pairing. D drives results, I drives people. Risk: both avoid deep process work. Assign a C to backstop quality.",
  "D+S":"Classic friction. D moves fast; S needs time. D needs to slow down; S needs to speak up. Both are loyal — find that common ground.",
  "D+C":"Productive tension. D wants speed; C wants accuracy. Set shared standards for 'good enough' or they'll fight every decision.",
  "I+S":"Natural harmony. Warm, collaborative, people-first. Risk: neither will push back hard or make tough calls. Need D energy for accountability.",
  "I+C":"Creative meets systematic. I generates; C refines. Works well on client deliverables. Friction when I wing it and C needs a plan.",

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function computeScores(answers){
  const t={D:0,I:0,S:0,C:0};
  // rank 1=most like me → 4pts, rank 4=least like me → 1pt
  QUESTION_SETS.forEach((set,qi)=>{Object.keys(set).forEach(d=>{if(answers[qi]&&answers[qi][d])t[d]+=(5-answers[qi][d]);});});
  return t;
}
function getPrimSec(scores){const s=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return{primary:s[0][0],secondary:s[1][0]};}
function comboKey(a,b){const dims=["D","I","S","C"];return dims.indexOf(a)<dims.indexOf(b)?a+"+"+b:b+"+"+a;}
function pct(score){return Math.round(((score-28)/(112-28))*100);}
function initials(name){return name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── OAUTH2 PKCE — POPUP FLOW (no redirect, no page navigation) ──────────────
// Main page never navigates away. Auth happens entirely in a popup window.

function b64url(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function genVerifier(){var a=new Uint8Array(32);crypto.getRandomValues(a);return b64url(a);}
function genStateVal(){var a=new Uint8Array(16);crypto.getRandomValues(a);return b64url(a);}
async function genChallenge(v){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return b64url(buf);
}

// The popup redirect URI — points to a tiny inline data URL that just closes itself
// We use a blank page approach: the popup loads, gets the code, sends it via postMessage
function getPopupRedirectUri(){
  return 'https://bmmolder.github.io/aspire-disc/auth-redirect.html';
}

function getStoredToken(){
  var t=sessionStorage.getItem('disc_at');
  var exp=parseInt(sessionStorage.getItem('disc_exp')||'0');
  return (t&&Date.now()<exp)?t:null;
}

async function getToken(){
  var t=getStoredToken();
  if(t) return t;
  // Token expired — trigger silent re-login via popup
  return new Promise(function(resolve,reject){
    doLogin().then(resolve).catch(reject);
  });
}

async function exchangeCode(code,verifier){
  var body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:'authorization_code',
    code:code,
    redirect_uri:getPopupRedirectUri(),
    code_verifier:verifier,
    scope:SCOPES.join(' '),
  });
  var r=await fetch(AUTHORITY+'/oauth2/v2.0/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body.toString(),
  });
  var data=await r.json();
  if(data.error) throw new Error((data.error_description||data.error).split('\r')[0]);
  var exp=Date.now()+(((data.expires_in||3600)-120)*1000);
  sessionStorage.setItem('disc_at',data.access_token);
  sessionStorage.setItem('disc_exp',String(exp));
  var name='User';
  if(data.id_token){
    try{
      var parts=data.id_token.split('.');
      var padded=parts[1].replace(/-/g,'+').replace(/_/g,'/');
      var payload=JSON.parse(atob(padded));
      name=payload.name||payload.preferred_username||'User';
    }catch(e){}
  }
  var email='';
  if(data.id_token){
    try{
      var pp=data.id_token.split('.');
      var pl=JSON.parse(atob(pp[1].replace(/-/g,'+').replace(/_/g,'/')));
      email=pl.preferred_username||pl.email||pl.upn||'';
    }catch(e){}
  }
  sessionStorage.setItem('disc_name',name);
  sessionStorage.setItem('disc_email',email);
  return {name:name,email:email};
}

function doLogin(){
  return new Promise(async function(resolve,reject){
    var verifier=genVerifier();
    var challenge=await genChallenge(verifier);
    var state=genStateVal();
    var p=new URLSearchParams({
      client_id:CLIENT_ID,
      response_type:'code',
      redirect_uri:getPopupRedirectUri(),
      scope:SCOPES.join(' '),
      state:state,
      code_challenge:challenge,
      code_challenge_method:'S256',
      response_mode:'query',
      prompt:'select_account',
    });
    var popup=window.open(AUTHORITY+'/oauth2/v2.0/authorize?'+p.toString(),'disc_auth','width=520,height=620,left=200,top=100');
    if(!popup){reject(new Error('Popup blocked. Please allow popups for this site and try again.'));return;}

    var timeout=setTimeout(function(){
      window.removeEventListener('message',handler);
      reject(new Error('Login timed out. Please try again.'));
    },120000);

    function handler(event){
      // Accept any message with our type — origin will be same github.io domain
      if(!event.data||event.data.type!=='disc_auth_code') return;
      window.removeEventListener('message',handler);
      clearTimeout(timeout);
      if(event.data.error){reject(new Error(event.data.error));return;}
      if(event.data.state!==state){reject(new Error('Security check failed. Please try again.'));return;}
      exchangeCode(event.data.code,verifier).then(resolve).catch(reject);
    }
    window.addEventListener('message',handler);
  });
}

function doSignOut(){
  sessionStorage.clear();
  setState({user:null,results:[],tab:'home'});
}

// ─── GRAPH API ───────────────────────────────────────────────────────────────
async function gGet(url){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{headers:{Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('Graph GET '+r.status+': '+await r.text());
  return r.json();
}
async function gPost(url,body){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Graph POST '+r.status+': '+await r.text());
  return r.json();
}
async function gPatch(url,body){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Graph PATCH '+r.status+': '+await r.text());
  return r.status===204?null:r.json();
}
async function gDelete(url){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'DELETE',headers:{Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('Graph DELETE '+r.status);
}

// ─── SHAREPOINT ───────────────────────────────────────────────────────────────
var _siteId=null, _listId=null;
async function getSiteId(){
  if(_siteId) return _siteId;
  const u=new URL(SP_SITE_URL);
  const data=await gGet('/sites/'+u.hostname+':'+u.pathname);
  _siteId=data.id; return _siteId;
}
async function ensureList(){
  if(_listId) return _listId;
  const sid=await getSiteId();
  const r=await gGet('/sites/'+sid+'/lists?$filter=displayName eq \''+encodeURIComponent(LIST_NAME)+'\'');
  if(r.value&&r.value.length){_listId=r.value[0].id;return _listId;}
  throw new Error('SharePoint list "'+LIST_NAME+'" not found. Please create it in SharePoint first.');
}
async function loadResults(){
  const sid=await getSiteId(); const lid=await ensureList();
  const data=await gGet('/sites/'+sid+'/lists/'+lid+'/items?expand=fields&$top=500');
  return (data.value||[]).map(function(item){return{
    id:item.id,spId:item.id,
    name:item.fields.EmployeeName||'',role:item.fields.Role||'',
    primary:item.fields.Primary||'D',secondary:item.fields.Secondary||'I',
    scores:{D:item.fields.ScoreD||0,I:item.fields.ScoreI||0,S:item.fields.ScoreS||0,C:item.fields.ScoreC||0},
    completedAt:item.fields.CompletedAt||item.fields.Created||'',
  };});
}
async function saveResult(result){
  const sid=await getSiteId(); const lid=await ensureList();
  const fields={EmployeeName:result.name,Role:result.role,Primary:result.primary,Secondary:result.secondary,ScoreD:result.scores.D,ScoreI:result.scores.I,ScoreS:result.scores.S,ScoreC:result.scores.C,CompletedAt:result.completedAt};
  // Always insert as new record — history is preserved, never overwritten
  const c=await gPost('/sites/'+sid+'/lists/'+lid+'/items',{fields:fields});
  return c.id;
}
async function deleteResult(spId){
  const sid=await getSiteId(); const lid=await ensureList();
  await gDelete('/sites/'+sid+'/lists/'+lid+'/items/'+spId);
}

function renderHome(){
  var cards=Object.entries(DISC_META).map(function(e){var d=e[0],m=e[1];return '<div class="card" style="border-top:4px solid '+m.color+';padding:20px 24px"><div style="font-size:28px;margin-bottom:8px">'+m.icon+'</div><div style="font-family:Syne,sans-serif;font-weight:800;font-size:17px;color:'+m.color+';margin-bottom:4px">'+d+' — '+m.label+'</div><div style="font-size:13px;color:#6B7280;line-height:1.55">'+STYLE_DESCRIPTIONS[d].headline+'</div></div>';}).join('');
  return '<div class="hero"><div class="hero-eyebrow">Team Communication Intelligence</div><h1 class="hero-title">Know your team.<br/><span>Lead with clarity.</span></h1><p class="hero-sub">A 28-question work style assessment that builds a shared language for how your team communicates, collaborates, and creates friction.</p><button class="btn btn-primary" style="font-size:16px;padding:16px 36px" data-tab="assess">Start Assessment →</button></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:32px">'+cards+'</div>';
}

function renderAssess(){
  if(state.assessStep==='info') return renderAssessInfo();
  return renderAssessQuestion();
}

function renderAssessInfo(){
  var valid=state.assessInfo.name.trim().length>1&&state.assessInfo.role.trim().length>1;
  return '<div><button class="btn btn-ghost" data-tab="home" style="margin-bottom:24px">← Back</button><div class="card" style="max-width:560px;margin:0 auto"><div class="card-title">Before We Begin</div><p style="font-size:14px;color:#6B7280;margin-bottom:24px;line-height:1.6">This assessment measures your work style at Aspire — how you communicate, make decisions, and engage with your team. There are no wrong answers. Be honest about how you actually behave at work.</p><div class="form-group"><label class="form-label">Your Name</label><input class="form-input" id="infoName" placeholder="First and last name" value="'+esc(state.assessInfo.name)+'" /></div><div class="form-group"><label class="form-label">Your Role at Aspire</label><input class="form-input" id="infoRole" placeholder="e.g. Help Desk Technician" value="'+esc(state.assessInfo.role)+'" /></div><div style="background:#F8FAFC;border-radius:10px;padding:14px 16px;margin-bottom:24px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">Quick instructions:</div><div style="font-size:13px;color:#6B7280;line-height:1.7">You\'ll see 28 rows, each with 4 words. <strong>Click each word in order</strong> from most like you (4) to least like you (1). Rank all four before moving on.</div></div><button class="btn btn-primary" id="startAssessBtn"'+(valid?'':' disabled')+' style="width:100%;justify-content:center">Start Assessment →</button></div></div>';
}

function renderAssessQuestion(){
  var qi=state.assessCurrentQ;
  var qA=state.assessAnswers[qi]||{};
  var complete=Object.keys(qA).length===4;
  var opts=state.assessShuffled[qi];
  var pctDone=Math.round(((qi+1)/QUESTION_SETS.length)*100);
  var optCards=opts.map(function(e){var dim=e[0],word=e[1],rank=qA[dim];return '<div class="option-card'+(rank?' selected':'')+'" data-dim="'+dim+'"><span class="option-word">'+esc(word)+'</span><div class="rank-badge'+(rank?' rank-'+rank:'')+'">'+( rank||'—')+'</div></div>';}).join('');
  var statusMsg='';
  if(Object.keys(qA).length>0&&!complete) statusMsg='<div class="alert alert-warn" style="margin-top:16px">'+(4-Object.keys(qA).length)+' word'+(4-Object.keys(qA).length>1?'s':'')+' remaining.</div>';
  if(complete) statusMsg='<div class="alert alert-success" style="margin-top:16px">✓ Complete. '+(qi<QUESTION_SETS.length-1?'Click Next.':'Click Submit!')+'</div>';
  return '<div style="max-width:660px;margin:0 auto"><div class="progress-wrap"><div class="progress-info"><span class="progress-label">Progress</span><span class="progress-count">'+(qi+1)+' of '+QUESTION_SETS.length+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pctDone+'%"></div></div></div><div class="card"><div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6B7280;font-weight:600;margin-bottom:4px">Question '+(qi+1)+'</div><h3 style="font-family:Syne,sans-serif;font-weight:700;font-size:19px;margin-bottom:8px;color:#1A3A5C">Which words best describe you at work?</h3><div style="font-size:14px;color:#6B7280;margin-bottom:20px">Click each word in order — most like you first, least like you last.</div><div class="rank-legend"><div class="rank-legend-item"><div class="rank-badge rank-1">1</div><span>Most like me</span></div><div class="rank-legend-item"><div class="rank-badge rank-4">4</div><span>Least like me</span></div></div><div class="options-grid">'+optCards+'</div>'+statusMsg+'<div class="q-nav"><button class="btn btn-outline" id="qPrevBtn">'+(qi===0?'← Cancel':'← Back')+'</button><button class="btn btn-primary" id="qNextBtn"'+(complete?'':' disabled')+'>'+(qi===QUESTION_SETS.length-1?'Submit Results →':'Next →')+'</button></div></div></div>';
}

function renderResult(){
  var r=state.activeResult;
  if(!r) return '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No result selected</div></div>';
  var pm=DISC_META[r.primary],sm=DISC_META[r.secondary];
  var pd=STYLE_DESCRIPTIONS[r.primary],sd=STYLE_DESCRIPTIONS[r.secondary];
  var combo=COMBO_TIPS[comboKey(r.primary,r.secondary)];
  var scoresHtml=Object.entries(DISC_META).map(function(e){var d=e[0],m=e[1];return '<div><div class="score-dim-header"><span class="score-dim-label" style="color:'+m.color+'">'+d+' — '+m.label+'</span><span class="score-dim-val">'+pct(r.scores[d])+'%</span></div><div class="score-track"><div class="score-fill" style="width:'+pct(r.scores[d])+'%;background:'+m.color+'"></div></div></div>';}).join('');
  var traitsHtml=pd.traits.map(function(t){return '<span class="trait-pill" style="background:'+pm.color+'22;color:'+pm.accent+'">'+t+'</span>';}).join('');
  return '<div style="max-width:720px;margin:0 auto"><button class="btn btn-ghost" data-tab="team" style="margin-bottom:20px">← Team Results</button><div class="result-header"><div class="result-name">'+esc(r.name)+'</div><div class="result-role">'+esc(r.role)+'</div><div class="result-profile">'+pm.icon+' Primary Style</div><div class="result-headline">'+pd.headline+'</div><div style="margin-top:8px;font-size:14px;color:rgba(255,255,255,0.5)">Primary: '+r.primary+' — '+pm.label+' · Secondary: '+r.secondary+' — '+sm.label+'</div></div><div class="card"><div class="card-title">Score Breakdown</div><div class="scores-grid">'+scoresHtml+'</div></div><div class="card"><div class="card-title">Primary Style: '+r.primary+' — '+pm.label+'</div><div class="style-detail" style="border-color:'+pm.color+';background:'+pm.bg+'"><div class="style-detail-title" style="color:'+pm.accent+'">'+pm.icon+' '+pd.headline+'</div><div class="style-row"><div class="style-row-label">Key Traits</div><div class="trait-pills">'+traitsHtml+'</div></div><div class="style-row"><div class="style-row-label">Strengths</div><div class="style-row-val">'+pd.strengths+'</div></div><div class="style-row"><div class="style-row-label">Watch For</div><div class="style-row-val">'+pd.watchFor+'</div></div><div class="style-row"><div class="style-row-label">In an MSP Environment</div><div class="style-row-val">'+pd.msp+'</div></div><div class="style-row"><div class="style-row-label">How to Work With Them</div><div class="style-row-val">'+pd.worksWith+'</div></div></div></div><div class="card"><div class="card-title">Secondary Style: '+r.secondary+' — '+sm.label+'</div><div class="style-detail" style="border-color:'+sm.color+';background:'+sm.bg+'"><div class="style-detail-title" style="color:'+sm.accent+'">'+sm.icon+' '+sd.headline+'</div><div class="style-row"><div class="style-row-label">Strengths</div><div class="style-row-val">'+sd.strengths+'</div></div><div class="style-row"><div class="style-row-label">In an MSP Environment</div><div class="style-row-val">'+sd.msp+'</div></div></div></div>'+(combo?'<div class="card" style="border-left:4px solid '+pm.color+'"><div class="card-title">Combined Profile: '+r.primary+'/'+r.secondary+'</div><p style="font-size:14px;line-height:1.65;color:#374151">'+combo+'</p></div>':'')+'<div class="card"><div class="card-title">⚠️ Where Friction Happens</div><p style="font-size:14px;line-height:1.65;color:#374151">'+pd.friction+'</p></div><div style="margin-top:8px;margin-bottom:32px">'+(isAdmin()?'<div style="text-align:right"><button class="btn btn-danger" id="deleteResultBtn">🗑 Delete This Record</button></div>':'')+renderHistory(r)+'</div></div>';
}


function renderHistory(currentResult){
  // Find all records for this person by name match
  var name=currentResult.name.trim().toLowerCase();
  var all=state.results.filter(function(r){return r.name.trim().toLowerCase()===name;});
  if(all.length<=1) return '';
  all.sort(function(a,b){return new Date(b.completedAt)-new Date(a.completedAt);});
  var rows=all.map(function(r,i){
    var date=r.completedAt?new Date(r.completedAt).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'Unknown date';
    var pm=DISC_META[r.primary],sm=DISC_META[r.secondary];
    var isCurrent=r.id===currentResult.id;
    return '<div style="display:flex;align-items:center;gap:16px;padding:12px 16px;background:'+(isCurrent?'rgba(200,151,42,0.08)':'#F9FAFB')+';border-radius:10px;border:1px solid '+(isCurrent?'rgba(200,151,42,0.3)':'#E5E7EB')+';margin-bottom:8px">'+
      '<div style="font-size:12px;color:#6B7280;min-width:100px">'+date+(isCurrent?' <span style="color:#4A8FD4;font-weight:700">← current</span>':'')+'</div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+
        '<span style="font-family:Syne,sans-serif;font-weight:800;color:'+pm.color+';font-size:15px">'+r.primary+'</span>'+
        '<span style="color:#D1D5DB;font-size:12px">/</span>'+
        '<span style="font-family:Syne,sans-serif;font-weight:700;color:'+sm.color+';font-size:13px">'+r.secondary+'</span>'+
      '</div>'+
      '<div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px">'+
        Object.entries(DISC_META).map(function(e){var d=e[0],m=e[1];var p=Math.round(((r.scores[d]-28)/(112-28))*100);return '<div style="font-size:11px;color:'+m.color+';font-weight:600">'+d+' '+p+'%</div>';}).join('')+
      '</div>'+
      (isAdmin()&&!isCurrent?'<button class="btn btn-danger" style="padding:6px 12px;font-size:12px" data-delete-id="'+r.id+'">Delete</button>':'')+
    '</div>';
  }).join('');
  return '<div class="card" style="margin-top:24px"><div class="card-title">📈 Assessment History ('+all.length+' records)</div>'+rows+'</div>';
}

function getLatestPerPerson(results){
  // Group all records by name, return latest per person + count
  var map={};
  results.forEach(function(r){
    var key=r.name.trim().toLowerCase();
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });
  return Object.values(map).map(function(records){
    records.sort(function(a,b){return new Date(b.completedAt)-new Date(a.completedAt);});
    return {latest:records[0],count:records.length,history:records};
  }).sort(function(a,b){return a.latest.name.localeCompare(b.latest.name);});
}

function renderTeam(){
  if(!state.results.length) return '<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">No assessments yet</div><div class="empty-sub" style="margin-bottom:24px">Have each team member take the assessment.</div><button class="btn btn-primary" data-tab="assess">Take First Assessment</button></div>';
  var people=getLatestPerPerson(state.results);

  people.forEach(function(p){dist[p.latest.primary]++;});
  var distHtml=Object.entries(DISC_META).map(function(e){var d=e[0],m=e[1];return '<div style="text-align:center;padding:16px 8px;background:'+m.bg+';border-radius:10px;border:2px solid '+m.color+'22"><div style="font-size:28px;font-family:Syne,sans-serif;font-weight:800;color:'+m.color+'">'+dist[d]+'</div><div style="font-size:12px;font-weight:700;color:'+m.accent+';margin-top:2px">'+d+' — '+m.label+'</div></div>';}).join('');

    var histBadge=p.count>1?'<span style="font-size:11px;background:#EAF2FB;color:#1A5276;border-radius:99px;padding:2px 8px;font-weight:600;">'+p.count+' assessments</span>':'';

  var alerts=(dist.D>=3?'<div class="alert alert-warn" style="margin-top:16px"><strong>High D concentration.</strong> Risk of conflict and skipping process.</div>':'')+(people.length>=4&&dist.S===0?'<div class="alert alert-warn" style="margin-top:16px"><strong>No High S primaries.</strong> Watch for gaps in steady execution.</div>':'');
  return '<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"><div><h2 style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:white;margin-bottom:4px">Team Results</h2><div style="font-size:14px;color:rgba(255,255,255,0.5)">'+people.length+' team member'+(people.length!==1?'s':'')+' · '+state.results.length+' total assessment'+(state.results.length!==1?'s':'')+' on record</div></div><button class="btn btn-primary" data-tab="assess">+ New Assessment</button></div><div class="card" style="margin-bottom:24px"><div class="card-title">Current Team Style Distribution</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'+distHtml+'</div>'+alerts+'</div><div class="team-grid">'+teamCards+'</div></div>';
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function bindSignIn(){
  var btn=document.getElementById('signInBtn');
  if(btn) btn.addEventListener('click',async function(){
    btn.disabled=true;
    btn.textContent='Signing in…';
    try{
      var info=await doLogin();
      state.user={name:info.name,email:info.email};
      setState({results:[],loading:true});
      loadResults().then(function(results){
        setState({results:results,loading:false});
      }).catch(function(e){
        setState({loading:false,error:'Signed in but could not load team data: '+e.message});
      });
    }catch(e){
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>Sign in with Microsoft';
      setState({error:e.message});
    }
  });
}

function bindEvents(){
  // Tab nav
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(){
      var tab=el.dataset.tab;
      if(tab==='assess'){
        setState({tab:'assess',assessStep:'info',assessCurrentQ:0,assessAnswers:{},assessRankQueue:1,assessShuffled:QUESTION_SETS.map(function(s){return shuffle(Object.entries(s));})});
      } else {
        setState({tab:tab});
      }
    });
  });

  // Sign out
  var soBtn=document.getElementById('signOutBtn');
  if(soBtn) soBtn.addEventListener('click',function(){
    sessionStorage.clear();
    setState({user:null,results:[],tab:'home',error:null});
  });

  // Info form
  var infoName=document.getElementById('infoName');
  var infoRole=document.getElementById('infoRole');
  var startBtn=document.getElementById('startAssessBtn');
  function checkValid(){
    if(startBtn) startBtn.disabled=!(state.assessInfo.name.trim().length>1&&state.assessInfo.role.trim().length>1);
  }
  if(infoName) infoName.addEventListener('input',function(e){state.assessInfo=Object.assign({},state.assessInfo,{name:e.target.value});checkValid();});
  if(infoRole) infoRole.addEventListener('input',function(e){state.assessInfo=Object.assign({},state.assessInfo,{role:e.target.value});checkValid();});
  if(startBtn) startBtn.addEventListener('click',function(){setState({assessStep:'questions'});});

  // Option cards
  document.querySelectorAll('.option-card').forEach(function(el){
    el.addEventListener('click',function(){
      var dim=el.dataset.dim;
      var qi=state.assessCurrentQ;
      var qA=Object.assign({},state.assessAnswers[qi]||{});
      if(qA[dim]){
        var removed=qA[dim]; delete qA[dim];
        var shifted={};
        Object.entries(qA).forEach(function(e){shifted[e[0]]=e[1]>removed?e[1]-1:e[1];});
        setState({assessAnswers:Object.assign({},state.assessAnswers,{[qi]:shifted}),assessRankQueue:Object.keys(shifted).length+1});
      } else if(state.assessRankQueue<=4){
        qA[dim]=state.assessRankQueue;
        setState({assessAnswers:Object.assign({},state.assessAnswers,{[qi]:qA}),assessRankQueue:state.assessRankQueue+1});
      }
    });
  });

  // Q nav
  var prevBtn=document.getElementById('qPrevBtn');
  var nextBtn=document.getElementById('qNextBtn');
  if(prevBtn) prevBtn.addEventListener('click',function(){
    if(state.assessCurrentQ===0){setState({tab:'home'});return;}
    var prev=state.assessCurrentQ-1;
    var pa=state.assessAnswers[prev]||{};
    setState({assessCurrentQ:prev,assessRankQueue:Object.keys(pa).length+1});
  });
  if(nextBtn) nextBtn.addEventListener('click',async function(){
    var qi=state.assessCurrentQ;
    if(qi<QUESTION_SETS.length-1){
      var next=qi+1; var na=state.assessAnswers[next]||{};
      setState({assessCurrentQ:next,assessRankQueue:Object.keys(na).length+1});
    } else {
      var scores=computeScores(state.assessAnswers);
      var ps=getPrimSec(scores);
      var result={name:state.assessInfo.name.trim(),role:state.assessInfo.role.trim(),scores:scores,primary:ps.primary,secondary:ps.secondary,completedAt:new Date().toISOString()};
      setState({saving:true});
      try{
        var spId=await saveResult(result);
        result.id=spId; result.spId=spId;
        setState({results:state.results.concat([result]),activeResult:result,tab:'result',saving:false,assessStep:'info',assessCurrentQ:0,assessAnswers:{}});
      }catch(e){setState({saving:false,error:'Failed to save: '+e.message});}
    }
  });

  // Team cards
  document.querySelectorAll('.team-card[data-result-id]').forEach(function(el){
    el.addEventListener('click',function(){
      var r=state.results.find(function(r){return r.id===el.dataset.resultId;});
      if(r) setState({activeResult:r,tab:'result'});
    });
  });
  // History record delete buttons (admin only)
  document.querySelectorAll('[data-delete-id]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var id=el.dataset.deleteId;
      var r=state.results.find(function(r){return r.id===id;});
      if(!r||!confirm('Delete this record for '+r.name+' ('+new Date(r.completedAt).toLocaleDateString()+')?')) return;
      setState({saving:true});
      deleteResult(id).then(function(){
        setState({results:state.results.filter(function(x){return x.id!==id;}),saving:false});
      }).catch(function(e){setState({saving:false,error:'Delete failed: '+e.message});});
    });
  });

  // Delete
  var delBtn=document.getElementById('deleteResultBtn');
  if(delBtn) delBtn.addEventListener('click',async function(){
    var r=state.activeResult;
    if(!r||!confirm('Delete this assessment record for '+r.name+'? This cannot be undone.')) return;
    setState({saving:true});
    try{
      await deleteResult(r.spId||r.id);
      var remaining=state.results.filter(function(x){return x.id!==r.id;});
      // If there are other records for this person, show the next most recent
      var nextForPerson=remaining.filter(function(x){return x.name.trim().toLowerCase()===r.name.trim().toLowerCase();}).sort(function(a,b){return new Date(b.completedAt)-new Date(a.completedAt);})[0];
      setState({results:remaining,activeResult:nextForPerson||null,tab:nextForPerson?'result':'team',saving:false});
    }catch(e){setState({saving:false,error:'Failed to delete: '+e.message});}
  });

  // Relationship selects
  var relA=document.getElementById('relSelectA');
  var relB=document.getElementById('relSelectB');
  if(relA) relA.addEventListener('change',function(e){setState({relPersonA:e.target.value});});
  if(relB) relB.addEventListener('change',function(e){setState({relPersonB:e.target.value});});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    var urlParams=new URLSearchParams(window.location.search);

    // Main window flow
    var token=getStoredToken();
    if(token){
      state.user={name:sessionStorage.getItem('disc_name')||'User',email:sessionStorage.getItem('disc_email')||''};
      setState({results:[],loading:false});
      loadResults().then(function(results){
        setState({results:results});
      }).catch(function(e){
        setState({error:'Could not load team data: '+e.message});
      });
      return;
    }

    // No token — show sign-in screen
    setState({loading:false});
  }catch(e){
    var msg = e && e.message ? e.message : String(e);
    // Try setState first, fall back to direct DOM write
    try {
      setState({loading:false,error:'Startup error: '+msg});
    } catch(e2) {
      var app = document.getElementById('app');
      if(app) app.innerHTML = '<div style="padding:40px;color:white;font-family:sans-serif"><h2 style="color:#4A8FD4;margin-bottom:16px">Error</h2><p style="color:rgba(255,255,255,0.7);font-size:14px;word-break:break-all">'+msg+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#2E6DB4;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">Retry</button></div>';
    }
  }
}

// Multiple fallbacks to ensure init always fires
function safeInit(){
  var app = document.getElementById('app');
  if(!app){
    // DOM not ready yet, keep trying
    setTimeout(safeInit, 50);
    return;
  }
  // Show we're alive immediately
  app.innerHTML = '<div class="loading-full"><div class="loading-spinner" style="width:36px;height:36px;border-width:3px;border-color:rgba(200,151,42,0.25);border-top-color:#E8B84B;"></div><span style="color:rgba(255,255,255,0.4);font-size:14px">Loading…</span></div>';
  init().catch(function(e){
    app.innerHTML = '<div style="padding:40px;color:white;font-family:sans-serif"><h2 style="color:#4A8FD4;margin-bottom:16px">Startup Error</h2><p style="color:rgba(255,255,255,0.7);font-size:14px;word-break:break-all">'+e.message+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#2E6DB4;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">Retry</button></div>';
  });
}

// Try immediately, also hook events as fallbacks
safeInit();
document.addEventListener('DOMContentLoaded', function(){ if(!document.getElementById('app').innerHTML.trim()) safeInit(); });
window.addEventListener('load', function(){ if(!document.getElementById('app').innerHTML.trim()) safeInit(); });
</script>
