const STYLE_DESCRIPTIONS = {

const COMBO_TIPS = {
  "D+I":"High energy pairing. D drives results, I drives people. Risk: both avoid deep process work. Assign a C to backstop quality.",
  "D+S":"Classic friction. D moves fast; S needs time. D needs to slow down; S needs to speak up. Both are loyal — find that common ground.",

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function computeScores(answers){
  const t={D:0,I:0,S:0,C:0};
  QUESTION_SETS.forEach((set,qi)=>{Object.keys(set).forEach(d=>{if(answers[qi]&&answers[qi][d])t[d]+=answers[qi][d];});});
  return t;
}
function getPrimSec(scores){const s=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return{primary:s[0][0],secondary:s[1][0]};}
function comboKey(a,b){const dims=["D","I","S","C"];return dims.indexOf(a)<dims.indexOf(b)?a+"+"+b:b+"+"+a;}
function pct(score){return Math.round(((score-28)/(112-28))*100);}
function initials(name){return name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── OAUTH2 PKCE — POPUP FLOW (no redirect, no page navigation) ──────────────
// Main page never navigates away. Auth happens entirely in a popup window.

function b64url(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function genVerifier(){var a=new Uint8Array(32);crypto.getRandomValues(a);return b64url(a);}
function genStateVal(){var a=new Uint8Array(16);crypto.getRandomValues(a);return b64url(a);}
async function genChallenge(v){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return b64url(buf);
}

// The popup redirect URI — points to a tiny inline data URL that just closes itself
// We use a blank page approach: the popup loads, gets the code, sends it via postMessage
function getPopupRedirectUri(){
  return 'https://bmmolder.github.io/aspire-disc/auth-redirect.html';
}

function getStoredToken(){
  var t=sessionStorage.getItem('disc_at');
  var exp=parseInt(sessionStorage.getItem('disc_exp')||'0');
  return (t&&Date.now()<exp)?t:null;
}

async function getToken(){
  var t=getStoredToken();
  if(t) return t;
  // Token expired — trigger silent re-login via popup
  return new Promise(function(resolve,reject){
    doLogin().then(resolve).catch(reject);
  });
}

async function exchangeCode(code,verifier){
  var body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:'authorization_code',
    code:code,
    redirect_uri:getPopupRedirectUri(),
    code_verifier:verifier,
    scope:SCOPES.join(' '),
  });
  var r=await fetch(AUTHORITY+'/oauth2/v2.0/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:body.toString(),
  });
  var data=await r.json();
  if(data.error) throw new Error((data.error_description||data.error).split('\r')[0]);
  var exp=Date.now()+(((data.expires_in||3600)-120)*1000);
  sessionStorage.setItem('disc_at',data.access_token);
  sessionStorage.setItem('disc_exp',String(exp));
  var name='User';
  if(data.id_token){
    try{
      var parts=data.id_token.split('.');
      var padded=parts[1].replace(/-/g,'+').replace(/_/g,'/');
      var payload=JSON.parse(atob(padded));
      name=payload.name||payload.preferred_username||'User';
    }catch(e){}
  }
  sessionStorage.setItem('disc_name',name);
  return name;
}

function doLogin(){
  return new Promise(async function(resolve,reject){
    var verifier=genVerifier();
    var challenge=await genChallenge(verifier);
    var state=genStateVal();
    var p=new URLSearchParams({
      client_id:CLIENT_ID,
      response_type:'code',
      redirect_uri:getPopupRedirectUri(),
      scope:SCOPES.join(' '),
      state:state,
      code_challenge:challenge,
      code_challenge_method:'S256',
      response_mode:'query',
      prompt:'select_account',
    });
    var popup=window.open(AUTHORITY+'/oauth2/v2.0/authorize?'+p.toString(),'disc_auth','width=520,height=620,left=200,top=100');
    if(!popup){reject(new Error('Popup blocked. Please allow popups for this site and try again.'));return;}

    var timeout=setTimeout(function(){
      window.removeEventListener('message',handler);
      reject(new Error('Login timed out. Please try again.'));
    },120000);

    function handler(event){
      // Accept any message with our type — origin will be same github.io domain
      if(!event.data||event.data.type!=='disc_auth_code') return;
      window.removeEventListener('message',handler);
      clearTimeout(timeout);
      if(event.data.error){reject(new Error(event.data.error));return;}
      if(event.data.state!==state){reject(new Error('Security check failed. Please try again.'));return;}
      exchangeCode(event.data.code,verifier).then(resolve).catch(reject);
    }
    window.addEventListener('message',handler);
  });
}

// ─── GRAPH API ───────────────────────────────────────────────────────────────
async function gGet(url){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{headers:{Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('Graph GET '+r.status+': '+await r.text());
  return r.json();
}
async function gPost(url,body){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Graph POST '+r.status+': '+await r.text());
  return r.json();
}
async function gPatch(url,body){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Graph PATCH '+r.status+': '+await r.text());
  return r.status===204?null:r.json();
}
async function gDelete(url){
  const t=await getToken();
  const r=await fetch(GRAPH+url,{method:'DELETE',headers:{Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('Graph DELETE '+r.status);
}

var _siteId=null, _listId=null;
async function getSiteId(){
  if(_siteId) return _siteId;
  const u=new URL(SP_SITE_URL);
  const data=await gGet('/sites/'+u.hostname+':'+u.pathname);
  _siteId=data.id; return _siteId;
}
async function ensureList(){
  if(_listId) return _listId;
  const sid=await getSiteId();
  try{
    const r=await gGet('/sites/'+sid+'/lists?$filter=displayName eq \''+encodeURIComponent(LIST_NAME)+'\'');
    if(r.value&&r.value.length){_listId=r.value[0].id;return _listId;}
  }catch(e){}
  const nl=await gPost('/sites/'+sid+'/lists',{
    displayName:LIST_NAME,
    columns:[
      {name:'EmployeeName',text:{}},{name:'Role',text:{}},
      {name:'Primary',text:{}},{name:'Secondary',text:{}},
      {name:'ScoreD',number:{}},{name:'ScoreI',number:{}},
      {name:'ScoreS',number:{}},{name:'ScoreC',number:{}},
      {name:'CompletedAt',dateTime:{}},
    ],
    list:{template:'genericList'}
  });
  _listId=nl.id; return _listId;
}
async function loadResults(){
  const sid=await getSiteId(); const lid=await ensureList();
  const data=await gGet('/sites/'+sid+'/lists/'+lid+'/items?expand=fields&$top=500');
  return (data.value||[]).map(function(item){return{
    id:item.id,spId:item.id,
    name:item.fields.EmployeeName||'',role:item.fields.Role||'',
    primary:item.fields.Primary||'D',secondary:item.fields.Secondary||'I',
    scores:{D:item.fields.ScoreD||0,I:item.fields.ScoreI||0,S:item.fields.ScoreS||0,C:item.fields.ScoreC||0},
    completedAt:item.fields.CompletedAt||item.fields.Created||'',
  };});
}
async function saveResult(result){
  const sid=await getSiteId(); const lid=await ensureList();
  const fields={EmployeeName:result.name,Role:result.role,Primary:result.primary,Secondary:result.secondary,ScoreD:result.scores.D,ScoreI:result.scores.I,ScoreS:result.scores.S,ScoreC:result.scores.C,CompletedAt:result.completedAt};
  if(result.spId){await gPatch('/sites/'+sid+'/lists/'+lid+'/items/'+result.spId+'/fields',fields);return result.spId;}
  const c=await gPost('/sites/'+sid+'/lists/'+lid+'/items',{fields:fields});
  return c.id;
}
async function deleteResult(spId){
  const sid=await getSiteId(); const lid=await ensureList();
  await gDelete('/sites/'+sid+'/lists/'+lid+'/items/'+spId);
}

  var aDesc=STYLE_DESCRIPTIONS[rA.primary],bDesc=STYLE_DESCRIPTIONS[rB.primary];
  var mA=DISC_META[rA.primary],mB=DISC_META[rB.primary];
  var vsHtml='<div class="rel-vs"><div class="rel-person"><div class="rel-avatar" style="background:'+mA.bg+';border:3px solid '+mA.color+';color:'+mA.color+'">'+initials(rA.name)+'</div><div class="rel-person-name">'+esc(rA.name)+'</div><div class="rel-person-style" style="color:'+mA.color+';font-weight:600">'+rA.primary+'/'+rA.secondary+'</div><div class="rel-person-style">'+esc(rA.role)+'</div></div><div style="font-size:28px;color:rgba(255,255,255,0.2)">×</div><div class="rel-person"><div class="rel-avatar" style="background:'+mB.bg+';border:3px solid '+mB.color+';color:'+mB.color+'">'+initials(rB.name)+'</div><div class="rel-person-name">'+esc(rB.name)+'</div><div class="rel-person-style" style="color:'+mB.color+';font-weight:600">'+rB.primary+'/'+rB.secondary+'</div><div class="rel-person-style">'+esc(rB.role)+'</div></div></div>';
  var tips=[
    {label:'Combined Style Dynamic',color:'#1E3A5F',bg:'#EAF2FB',text:combo||rA.primary+'/'+rB.primary+' pairing. Understand each other\'s pace and decision-making style.'},
    {label:'How '+rA.name+' likely experiences '+rB.name,color:mA.accent,bg:mA.bg,text:'As a High '+rA.primary+', '+rA.name+' may find '+rB.name+'\'s style '+bDesc.headline.toLowerCase()+' — which brings complementary strengths. '+aDesc.worksWith},
    {label:'How '+rB.name+' likely experiences '+rA.name,color:mB.accent,bg:mB.bg,text:'As a High '+rB.primary+', '+rB.name+' may experience '+rA.name+'\'s '+aDesc.headline.toLowerCase()+' energy as challenging at times. '+bDesc.worksWith},
    {label:'Watch For',color:'#991B1B',bg:'#FEF2F2',text:aDesc.watchFor+' | '+bDesc.watchFor},
    {label:'Combined Strengths',color:'#065F46',bg:'#ECFDF5',text:aDesc.strengths+' + '+bDesc.strengths},
  ];
  var tipsHtml=tips.map(function(t){return '<div class="tip-card" style="background:'+t.bg+';border:1px solid '+t.color+'22"><div class="tip-label" style="color:'+t.color+'">'+t.label+'</div><div class="tip-text" style="color:#374151">'+t.text+'</div></div>';}).join('');
  return '<div style="max-width:720px;margin:0 auto"><div style="margin-bottom:32px"><h2 style="font-family:Syne,sans-serif;font-weight:800;font-size:24px;color:white;margin-bottom:8px">Relationship Guide</h2><p style="font-size:15px;color:rgba(255,255,255,0.55)">Select any two team members to understand their communication dynamic.</p></div>'+selectHtml+vsHtml+tipsHtml+'</div>';
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function bindSignIn(){
  var btn=document.getElementById('signInBtn');
  if(btn) btn.addEventListener('click',async function(){
    btn.disabled=true;
    btn.textContent='Signing in…';
    try{
      var name=await doLogin();
      state.user={name:name};
      setState({results:[],loading:true});
      loadResults().then(function(results){
        setState({results:results,loading:false});
      }).catch(function(e){
        setState({loading:false,error:'Signed in but could not load team data: '+e.message});
      });
    }catch(e){
      btn.disabled=false;
      btn.innerHTML='<svg viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>Sign in with Microsoft';
      setState({error:e.message});
    }
  });
}

function bindEvents(){
  // Tab nav
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(){
      var tab=el.dataset.tab;
      if(tab==='assess'){
        setState({tab:'assess',assessStep:'info',assessCurrentQ:0,assessAnswers:{},assessRankQueue:1,assessShuffled:QUESTION_SETS.map(function(s){return shuffle(Object.entries(s));})});
      } else {
        setState({tab:tab});
      }
    });
  });

  // Sign out
  var soBtn=document.getElementById('signOutBtn');
  if(soBtn) soBtn.addEventListener('click',function(){
    sessionStorage.clear();
    setState({user:null,results:[],tab:'home',error:null});
  });

  // Info form
  var infoName=document.getElementById('infoName');
  var infoRole=document.getElementById('infoRole');
  var startBtn=document.getElementById('startAssessBtn');
  function checkValid(){
    if(startBtn) startBtn.disabled=!(state.assessInfo.name.trim().length>1&&state.assessInfo.role.trim().length>1);
  }
  if(infoName) infoName.addEventListener('input',function(e){state.assessInfo=Object.assign({},state.assessInfo,{name:e.target.value});checkValid();});
  if(infoRole) infoRole.addEventListener('input',function(e){state.assessInfo=Object.assign({},state.assessInfo,{role:e.target.value});checkValid();});
  if(startBtn) startBtn.addEventListener('click',function(){setState({assessStep:'questions'});});

  // Option cards
  document.querySelectorAll('.option-card').forEach(function(el){
    el.addEventListener('click',function(){
      var dim=el.dataset.dim;
      var qi=state.assessCurrentQ;
      var qA=Object.assign({},state.assessAnswers[qi]||{});
      if(qA[dim]){
        var removed=qA[dim]; delete qA[dim];
        var shifted={};
        Object.entries(qA).forEach(function(e){shifted[e[0]]=e[1]>removed?e[1]-1:e[1];});
        setState({assessAnswers:Object.assign({},state.assessAnswers,{[qi]:shifted}),assessRankQueue:Object.keys(shifted).length+1});
      } else if(state.assessRankQueue<=4){
        qA[dim]=state.assessRankQueue;
        setState({assessAnswers:Object.assign({},state.assessAnswers,{[qi]:qA}),assessRankQueue:state.assessRankQueue+1});
      }
    });
  });

  // Q nav
  var prevBtn=document.getElementById('qPrevBtn');
  var nextBtn=document.getElementById('qNextBtn');
  if(prevBtn) prevBtn.addEventListener('click',function(){
    if(state.assessCurrentQ===0){setState({tab:'home'});return;}
    var prev=state.assessCurrentQ-1;
    var pa=state.assessAnswers[prev]||{};
    setState({assessCurrentQ:prev,assessRankQueue:Object.keys(pa).length+1});
  });
  if(nextBtn) nextBtn.addEventListener('click',async function(){
    var qi=state.assessCurrentQ;
    if(qi<QUESTION_SETS.length-1){
      var next=qi+1; var na=state.assessAnswers[next]||{};
      setState({assessCurrentQ:next,assessRankQueue:Object.keys(na).length+1});
    } else {
      var scores=computeScores(state.assessAnswers);
      var ps=getPrimSec(scores);
      var result={name:state.assessInfo.name.trim(),role:state.assessInfo.role.trim(),scores:scores,primary:ps.primary,secondary:ps.secondary,completedAt:new Date().toISOString()};
      setState({saving:true});
      try{
        var spId=await saveResult(result);
        result.id=spId; result.spId=spId;
        setState({results:state.results.concat([result]),activeResult:result,tab:'result',saving:false,assessStep:'info',assessCurrentQ:0,assessAnswers:{}});
      }catch(e){setState({saving:false,error:'Failed to save: '+e.message});}
    }
  });

  // Team cards
  document.querySelectorAll('.team-card[data-result-id]').forEach(function(el){
    el.addEventListener('click',function(){
      var r=state.results.find(function(r){return r.id===el.dataset.resultId;});
      if(r) setState({activeResult:r,tab:'result'});
    });
  });

  // Delete
  var delBtn=document.getElementById('deleteResultBtn');
  if(delBtn) delBtn.addEventListener('click',async function(){
    var r=state.activeResult;
    if(!r||!confirm('Delete '+r.name+'\'s results? This cannot be undone.')) return;
    setState({saving:true});
    try{
      await deleteResult(r.spId||r.id);
      setState({results:state.results.filter(function(x){return x.id!==r.id;}),activeResult:null,tab:'team',saving:false});
    }catch(e){setState({saving:false,error:'Failed to delete: '+e.message});}
  });

  // Relationship selects
  var relA=document.getElementById('relSelectA');
  var relB=document.getElementById('relSelectB');
  if(relA) relA.addEventListener('change',function(e){setState({relPersonA:e.target.value});});
  if(relB) relB.addEventListener('change',function(e){setState({relPersonB:e.target.value});});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    var urlParams=new URLSearchParams(window.location.search);

    // Main window flow
    var token=getStoredToken();
    if(token){
      state.user={name:sessionStorage.getItem('disc_name')||'User'};
      setState({results:[],loading:false});
      loadResults().then(function(results){
        setState({results:results});
      }).catch(function(e){
        setState({error:'Could not load team data: '+e.message});
      });
      return;
    }

    // No token — show sign-in screen
    setState({loading:false});
  }catch(e){
    var msg = e && e.message ? e.message : String(e);
    // Try setState first, fall back to direct DOM write
    try {
      setState({loading:false,error:'Startup error: '+msg});
    } catch(e2) {
      var app = document.getElementById('app');
      if(app) app.innerHTML = '<div style="padding:40px;color:white;font-family:sans-serif"><h2 style="color:#E8B84B;margin-bottom:16px">Error</h2><p style="color:rgba(255,255,255,0.7);font-size:14px;word-break:break-all">'+msg+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#C8972A;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">Retry</button></div>';
    }
  }
}

// Multiple fallbacks to ensure init always fires
function safeInit(){
  var app = document.getElementById('app');
  if(!app){
    // DOM not ready yet, keep trying
    setTimeout(safeInit, 50);
    return;
  }
  // Show we're alive immediately
  app.innerHTML = '<div class="loading-full"><div class="loading-spinner" style="width:36px;height:36px;border-width:3px;border-color:rgba(200,151,42,0.25);border-top-color:#E8B84B;"></div><span style="color:rgba(255,255,255,0.4);font-size:14px">Loading…</span></div>';
  init().catch(function(e){
    app.innerHTML = '<div style="padding:40px;color:white;font-family:sans-serif"><h2 style="color:#E8B84B;margin-bottom:16px">Startup Error</h2><p style="color:rgba(255,255,255,0.7);font-size:14px;word-break:break-all">'+e.message+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#C8972A;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">Retry</button></div>';
  });
}

// Try immediately, also hook events as fallbacks
safeInit();
document.addEventListener('DOMContentLoaded', function(){ if(!document.getElementById('app').innerHTML.trim()) safeInit(); });
window.addEventListener('load', function(){ if(!document.getElementById('app').innerHTML.trim()) safeInit(); });
</script>
